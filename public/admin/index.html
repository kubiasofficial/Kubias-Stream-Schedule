<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KUBIAS — správa programu</title><link rel="icon" href="../assets/mojelogo.png"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="admin.css"><script defer src="../schedule.js"></script><script type="module" src="admin.js"></script></head><body><main class="admin-shell"><a href="/">← Veřejný web</a><h1>Správa programu<span class="accent">.</span></h1><p id="message" role="status">Načítám nastavení…</p><button id="login" class="button primary" hidden>Přihlásit přes Google</button><button id="logout" class="button secondary" hidden>Odhlásit</button><p id="identity"></p><section id="workspace" hidden><div class="actions"><button id="new" class="button primary">Nový termín</button><button id="seed" class="button secondary">Importovat WestHaven 28. 9. 2026</button><button id="backup" class="button secondary">Stáhnout zálohu JSON</button></div><p>Všechny časy zadávej v časovém pásmu Praha. LIVE potvrzuješ ručně a automaticky vyprší nejpozději za 8 hodin.</p><form id="editor"><h2 id="editor-title">Nový termín</h2><label>Název<input name="title" maxlength="120" required></label><label>Popis<textarea name="description" maxlength="1000" required></textarea></label><div class="fields"><label>Začátek (Praha)<input name="start" type="datetime-local" required></label><label>Orientační konec (Praha)<input name="end" type="datetime-local" required></label><label>Hra<select name="theme"><option value="rp">RedM / WestHaven</option><option value="sim">SimRail</option><option value="horror">Dead by Daylight</option><option value="community">Komunitní hraní</option></select></label><label>Platforma<select name="platform"><option value="twitch">Twitch · kubiasofiko</option></select></label><label>Stav<select name="status"><option value="confirmed">Potvrzeno</option><option value="tentative">Předběžně</option><option value="cancelled">Zrušeno</option></select></label><label>Viditelnost<select name="visibility"><option value="draft">Koncept — jen pro mě</option><option value="published">Publikováno</option></select></label></div><label>Poznámka ke změně<input name="change" maxlength="200" placeholder="Např. Nový začátek 19:00"></label><button id="save" class="button primary">Uložit termín</button><button type="button" id="discard" class="button secondary">Zavřít / zahodit změny</button></form><h2>Všechny termíny</h2><div id="list"></div></section></main></body></html>
